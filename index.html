<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design World — Explore New Ideas</title>

  <!-- Google Fonts: Poppins (300, 400, 500, 600, 700, 800) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Three.js r169 Import Map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>

  <style>
    :root {
      --bg: #000;
      --fg: #fff;
      --pad-x: clamp(20px, 6.95vw, 120px);
    }
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      background: #000;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      min-height: 520px;
      overflow: hidden;
      background: #000;
    }

    #scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      touch-action: none;
    }
    #scene.dragging {
      cursor: grabbing;
    }

    .ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }
    .ui a, .ui button {
      pointer-events: auto;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* NAV */
    .nav {
      position: absolute;
      top: clamp(24px, 4.7vh, 40px);
      left: var(--pad-x);
      right: var(--pad-x);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      letter-spacing: -0.01em;
    }
    .logo-mark {
      width: 20px;
      height: 40px;
      background: #fff;
      border-radius: 0 20px 20px 0;
    }
    .logo b {
      font-weight: 700;
    }
    .logo span {
      font-weight: 400;
    }

    .nav-links {
      display: flex;
      gap: clamp(20px, 4.1vw, 60px);
      list-style: none;
    }
    .nav-links a {
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      position: relative;
      cursor: pointer;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -4px;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: right;
      transition: transform .35s ease;
    }
    .nav-links a:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    /* ARROWS (top-right, left of the dots column) */
    .arrows {
      position: absolute;
      top: 18.9%;
      left: 76.7%;
      display: flex;
      gap: 32px;
      transform: translate(-19px, -50%);
    }
    .arrow {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2.5px solid #fff;
      background: transparent;
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background .25s, color .25s;
    }
    .arrow svg {
      width: 18px;
      height: 18px;
    }
    .arrow:hover {
      background: #fff;
      color: #000;
    }

    /* PAGINATION DOTS (vertical, right edge) */
    .dots {
      position: absolute;
      right: calc(var(--pad-x) - 7px);
      top: 49.4%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 33px;
    }
    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: #fff;
      cursor: pointer;
      transition: background .25s;
    }
    .dot.active {
      background: transparent;
    }

    /* TAGLINE (bottom-left) */
    .tagline {
      position: absolute;
      left: var(--pad-x);
      bottom: clamp(40px, 7.5vh, 70px);
      font-size: clamp(24px, 2.65vw, 44px);
      line-height: 1.2;
      font-weight: 300;
      letter-spacing: -0.01em;
    }
    .tagline strong {
      font-weight: 700;
      display: block;
    }

    /* CTA ROW (button -> horizontal line -> giant outlined "07" bleeding off right edge) */
    .cta-row {
      position: absolute;
      left: 45.6%;
      right: -1vw;
      top: 88.7%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
    }
    .cta {
      flex: none;
      padding: 0 15px;
      height: 48px;
      display: inline-flex;
      align-items: center;
      border: 1.5px solid rgba(255, 255, 255, .85);
      border-radius: 6px;
      background: rgba(0, 0, 0, .15);
      color: #fff;
      font-size: 14px;
      font-weight: 400;
      text-decoration: none;
      cursor: pointer;
      transition: background .25s, color .25s;
    }
    .cta:hover {
      background: #fff;
      color: #000;
    }
    .cta-line {
      flex: 1;
      height: 1.5px;
      background: rgba(255, 255, 255, .8);
      min-width: 40px;
    }
    .count {
      flex: none;
      font-size: clamp(140px, 19.8vw, 360px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.02em;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(255, 255, 255, .9);
      transform: translateY(6%);
      user-select: none;
    }

    /* LOADER */
    .loader {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 12px;
      letter-spacing: .2em;
      text-transform: uppercase;
      opacity: .6;
      transition: opacity .6s;
      pointer-events: none;
    }
    .loader.done {
      opacity: 0;
    }

    /* RESPONSIVE */
    @media (max-width: 900px), (max-aspect-ratio: 1/1) {
      .arrows {
        left: auto;
        right: var(--pad-x);
        top: 15%;
        transform: translateY(-50%);
        gap: 14px;
      }
      .tagline {
        bottom: clamp(150px, 20vh, 220px);
      }
      .cta-row {
        left: var(--pad-x);
        right: -3vw;
        top: auto;
        bottom: 24px;
        transform: none;
      }
      .count {
        font-size: clamp(120px, 22vw, 200px);
      }
    }
    @media (max-width: 640px) {
      .nav-links {
        gap: 16px;
      }
      .nav-links a, .logo {
        font-size: 13px;
      }
      .dots {
        gap: 20px;
        right: 16px;
      }
      .dot {
        width: 10px;
        height: 10px;
      }
      .cta-row {
        right: -8vw;
      }
      .count {
        font-size: 120px;
      }
    }
    @media (max-width: 420px) {
      .nav-links li:nth-child(2) {
        display: none;
      }
    }
  </style>
</head>
<body>
  <section class="hero" id="hero">
    <canvas id="scene" aria-label="Rotatable glass cube. Drag to rotate."></canvas>

    <div class="ui">
      <h1 class="sr-only">Explore New Ideas</h1>

      <header class="nav">
        <a href="#" class="logo">
          <i class="logo-mark"></i>
          <b>Design</b><span>World</span>
        </a>
        <ul class="nav-links">
          <li><a href="#">Home</a></li>
          <li><a href="#">Portfolio</a></li>
          <li><a href="#">Contact Us</a></li>
        </ul>
      </header>

      <div class="arrows">
        <button class="arrow" id="prev" aria-label="Rotate left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M11 6l-6 6 6 6" />
          </svg>
        </button>
        <button class="arrow" id="next" aria-label="Rotate right">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </button>
      </div>

      <nav class="dots" aria-label="Pagination">
        <button class="dot" aria-label="Slide 1"></button>
        <button class="dot active" aria-label="Slide 2"></button>
        <button class="dot" aria-label="Slide 3"></button>
      </nav>

      <p class="tagline">Let's Build the<br>Future of <strong>Design.</strong></p>

      <div class="cta-row">
        <a href="#" class="cta">Explore Now</a>
        <span class="cta-line"></span>
        <span class="count" aria-hidden="true">07</span>
      </div>

      <div class="loader" id="loader">Loading model</div>
    </div>
  </section>

  <!-- Application Logic using Three.js module import -->
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    const MODEL_URL = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260929_212926_92423081-b0e4-4f5a-b650-14af6c05c058.glb';

    const canvas = document.getElementById('scene');
    const hero = document.getElementById('hero');
    const loaderEl = document.getElementById('loader');

    // 1. Renderer & Camera
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: false,
      powerPreference: 'high-performance'
    });
    renderer.setClearColor(0x000000, 1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
    camera.position.set(0, 0, 10);
    camera.lookAt(0, 0, 0);

    // 2. Offscreen 2D Canvas for Headline Texture
    const textCanvas = document.createElement('canvas');
    const textCtx = textCanvas.getContext('2d');
    const bgTex = new THREE.CanvasTexture(textCanvas);
    bgTex.colorSpace = THREE.SRGBColorSpace;
    bgTex.minFilter = THREE.LinearFilter;
    bgTex.magFilter = THREE.LinearFilter;
    bgTex.generateMipmaps = false;

    // Fullscreen quad for background in its own scene
    const bgScene = new THREE.Scene();
    const bgMat = new THREE.ShaderMaterial({
      uniforms: {
        uTex: { value: bgTex }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D uTex;
        varying vec2 vUv;
        void main() {
          gl_FragColor = texture2D(uTex, vUv);
          #include <colorspace_fragment>
        }
      `,
      depthTest: false,
      depthWrite: false
    });
    bgMat.frustumCulled = false;
    const bgQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat);
    bgQuad.frustumCulled = false;
    bgScene.add(bgQuad);

    // 3. Render Targets for Two-Pass Refraction
    let rtBack = null;
    let rtFront = null;

    // 4. Custom Glass Shader Materials
    const glassUniformsBase = {
      uResolution: { value: new THREE.Vector2(1, 1) },
      uTexture: { value: null },
      uChromatic: { value: 0.5 },
      uSaturation: { value: 1.08 },
      uShininess: { value: 90.0 },
      uDiffuseness: { value: 0.02 },
      uFresnelPower: { value: 5.0 },
      uLight: { value: new THREE.Vector3(-1.0, 1.0, 1.0) }
    };

    const vertexShader = `
      varying vec3 vNormal;
      varying vec3 vEye;
      void main() {
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vec4 mvPos = viewMatrix * worldPos;
        gl_Position = projectionMatrix * mvPos;
        vNormal = normalize(normalMatrix * normal);
        vEye = normalize(mvPos.xyz);
      }
    `;

    const fragmentShader = `
      uniform vec2 uResolution;
      uniform sampler2D uTexture;
      uniform float uRefractPower;
      uniform float uChromatic;
      uniform float uSaturation;
      uniform float uShininess;
      uniform float uDiffuseness;
      uniform float uFresnelPower;
      uniform vec3 uLight;
      uniform float uBackside;

      varying vec3 vNormal;
      varying vec3 vEye;

      const float uIorR = 1.15;
      const float uIorY = 1.16;
      const float uIorG = 1.18;
      const float uIorC = 1.22;
      const float uIorB = 1.22;
      const float uIorP = 1.22;

      float specFunc(vec3 n, vec3 l, vec3 view, float shininess, float diffuseness) {
        vec3 h = normalize(l + view);
        return pow(max(dot(n, h), 0.0), shininess) + max(0.0, dot(n, l)) * diffuseness;
      }

      void main() {
        vec2 uv = gl_FragCoord.xy / uResolution;
        vec3 n = normalize(vNormal);
        if (uBackside > 0.5) n = -n;
        vec3 eye = normalize(vEye);
        vec3 view = -eye;

        vec3 color = vec3(0.0);
        const int LOOP = 16;
        for (int i = 0; i < LOOP; i++) {
          float slide = float(i) / float(LOOP) * 0.045;

          vec3 refrR = refract(eye, n, 1.0 / uIorR);
          vec3 refrY = refract(eye, n, 1.0 / uIorY);
          vec3 refrG = refract(eye, n, 1.0 / uIorG);
          vec3 refrC = refract(eye, n, 1.0 / uIorC);
          vec3 refrB = refract(eye, n, 1.0 / uIorB);
          vec3 refrP = refract(eye, n, 1.0 / uIorP);

          vec4 texR = texture2D(uTexture, uv + refrR.xy * (uRefractPower + slide * 1.0) * uChromatic);
          vec4 texY = texture2D(uTexture, uv + refrY.xy * (uRefractPower + slide * 1.0) * uChromatic);
          vec4 texG = texture2D(uTexture, uv + refrG.xy * (uRefractPower + slide * 2.0) * uChromatic);
          vec4 texC = texture2D(uTexture, uv + refrC.xy * (uRefractPower + slide * 2.5) * uChromatic);
          vec4 texB = texture2D(uTexture, uv + refrB.xy * (uRefractPower + slide * 3.0) * uChromatic);
          vec4 texP = texture2D(uTexture, uv + refrP.xy * (uRefractPower + slide * 1.0) * uChromatic);

          float r = texR.r * 0.5;
          float y = (texY.r * 2.0 + texY.g * 2.0 - texY.b) / 6.0;
          float g = texG.g * 0.5;
          float c = (texC.g * 2.0 + texC.b * 2.0 - texC.r) / 6.0;
          float b = texB.b * 0.5;
          float p = (texP.b * 2.0 + texP.r * 2.0 - texP.g) / 6.0;

          float R = r + (2.0 * p + 2.0 * y - c) / 3.0;
          float G = g + (2.0 * y + 2.0 * c - p) / 3.0;
          float B = b + (2.0 * c + 2.0 * p - y) / 3.0;

          color += vec3(R, G, B);
        }

        color /= float(LOOP);

        float luma = dot(color, vec3(0.2125, 0.7154, 0.0721));
        color = mix(vec3(luma), color, uSaturation);

        vec3 l1 = normalize(-uLight);
        vec3 l2 = normalize(-vec3(1.0, 1.0, -1.0));
        float spec = specFunc(n, l1, view, uShininess, uDiffuseness) + 0.6 * specFunc(n, l2, view, uShininess * 0.6, uDiffuseness * 0.5);
        color += spec * (uBackside > 0.5 ? 0.35 : 1.0);

        float f = pow(clamp(1.0 + dot(eye, n), 0.0, 1.0), uFresnelPower);
        color = mix(color, vec3(1.0), f * (uBackside > 0.5 ? 0.25 : 0.55));

        color += vec3(0.004, 0.005, 0.007);
        gl_FragColor = vec4(color, 1.0);
        #include <colorspace_fragment>
      }
    `;

    const backMat = new THREE.ShaderMaterial({
      uniforms: {
        ...THREE.UniformsUtils.clone(glassUniformsBase),
        uRefractPower: { value: 0.22 },
        uBackside: { value: 1.0 }
      },
      vertexShader,
      fragmentShader,
      side: THREE.BackSide,
      transparent: false
    });

    const frontMat = new THREE.ShaderMaterial({
      uniforms: {
        ...THREE.UniformsUtils.clone(glassUniformsBase),
        uRefractPower: { value: 0.30 },
        uBackside: { value: 0.0 }
      },
      vertexShader,
      fragmentShader,
      side: THREE.FrontSide,
      transparent: false
    });

    // 5. Main 3D Scene Graph
    const scene = new THREE.Scene();
    const pivot = new THREE.Group();
    const spinner = new THREE.Group();
    pivot.add(spinner);
    scene.add(pivot);

    // Initial spinner orientation: Euler(-0.42, 0.62, 0.18)
    spinner.rotation.set(-0.42, 0.62, 0.18);
    spinner.quaternion.setFromEuler(spinner.rotation);

    let cubeMesh = null;

    function applyGeometry(geom) {
      geom.computeBoundingBox();
      geom.center();
      const size = new THREE.Vector3();
      geom.boundingBox.getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z);
      if (maxDim > 0) {
        geom.scale(1 / maxDim, 1 / maxDim, 1 / maxDim);
      }
      cubeMesh = new THREE.Mesh(geom, frontMat);
      spinner.add(cubeMesh);
      if (loaderEl) loaderEl.classList.add('done');
    }

    // Load Model or Fallback
    const gltfLoader = new GLTFLoader();
    gltfLoader.load(
      MODEL_URL,
      (gltf) => {
        try {
          const geoms = [];
          gltf.scene.updateMatrixWorld(true);
          gltf.scene.traverse((child) => {
            if (child.isMesh && child.geometry) {
              const g = child.geometry.clone();
              if (g.attributes.uv) g.deleteAttribute('uv');
              if (g.attributes.color) g.deleteAttribute('color');
              if (g.attributes.tangent) g.deleteAttribute('tangent');
              const merged = mergeVertices(g, 1e-4);
              merged.computeVertexNormals();
              merged.applyMatrix4(child.matrixWorld);
              geoms.push(merged);
            }
          });

          if (geoms.length > 0) {
            const finalGeom = mergeGeometries(geoms, false);
            applyGeometry(finalGeom);
          } else {
            applyGeometry(new RoundedBoxGeometry(1, 1, 1, 8, 0.12));
          }
        } catch (e) {
          console.warn('Error processing GLTF, using fallback:', e);
          applyGeometry(new RoundedBoxGeometry(1, 1, 1, 8, 0.12));
        }
      },
      undefined,
      (err) => {
        console.warn('GLTF loading failed, using fallback:', err);
        applyGeometry(new RoundedBoxGeometry(1, 1, 1, 8, 0.12));
      }
    );

    // 6. Draw 2D Background Headline onto Canvas
    function drawBackgroundText(W, H, dpr) {
      const cw = Math.max(1, Math.round(W * dpr));
      const ch = Math.max(1, Math.round(H * dpr));

      if (textCanvas.width !== cw || textCanvas.height !== ch) {
        textCanvas.width = cw;
        textCanvas.height = ch;
      }

      textCtx.save();
      textCtx.scale(dpr, dpr);

      textCtx.fillStyle = '#000000';
      textCtx.fillRect(0, 0, W, H);

      const mobile = (W < 768) || (W / H < 1);
      let fs = Math.min(H * 0.21, W * (mobile ? 0.21 : 0.118));

      const lines = ['Explore', 'New', 'Ideas'];
      textCtx.font = `800 ${fs}px Poppins`;

      let maxW = 0;
      for (let line of lines) {
        maxW = Math.max(maxW, textCtx.measureText(line).width);
      }
      const allowedW = W * (mobile ? 0.9 : 0.5);
      if (maxW > allowedW && maxW > 0) {
        fs *= (allowedW / maxW);
        textCtx.font = `800 ${fs}px Poppins`;
      }

      const cx = W * (mobile ? 0.5 : 0.505);
      const cy = H * (mobile ? 0.45 : 0.468);
      const gap = fs * 1.07;
      const cap = fs * 0.7;

      textCtx.fillStyle = '#e9e9e9';
      textCtx.textAlign = 'center';
      textCtx.textBaseline = 'alphabetic';

      for (let i = 0; i < lines.length; i++) {
        const y = cy + cap / 2 + (i - 1) * gap;
        textCtx.fillText(lines[i], cx, y);
      }

      textCtx.restore();
      bgTex.needsUpdate = true;
    }

    // 7. Layout & Resize Calculation
    function layout() {
      const W = hero.clientWidth || window.innerWidth;
      const H = hero.clientHeight || window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      renderer.setPixelRatio(dpr);
      renderer.setSize(W, H);

      camera.aspect = W / H;
      camera.updateProjectionMatrix();

      const drawW = Math.round(W * dpr);
      const drawH = Math.round(H * dpr);

      // Render Targets Reallocation
      if (!rtBack || rtBack.width !== drawW || rtBack.height !== drawH) {
        if (rtBack) rtBack.dispose();
        if (rtFront) rtFront.dispose();

        const rtParams = {
          type: THREE.HalfFloatType,
          minFilter: THREE.LinearFilter,
          magFilter: THREE.LinearFilter,
          generateMipmaps: false,
          depthBuffer: true
        };
        rtBack = new THREE.WebGLRenderTarget(drawW, drawH, rtParams);
        rtFront = new THREE.WebGLRenderTarget(drawW, drawH, rtParams);

        backMat.uniforms.uTexture.value = rtBack.texture;
        frontMat.uniforms.uTexture.value = rtFront.texture;
      }

      backMat.uniforms.uResolution.value.set(drawW, drawH);
      frontMat.uniforms.uResolution.value.set(drawW, drawH);

      // Redraw background headline
      drawBackgroundText(W, H, dpr);

      // Cube positioning & scaling
      const fovRad = (camera.fov * Math.PI) / 180;
      const visH = 2 * Math.tan(fovRad / 2) * 10;
      const visW = visH * camera.aspect;

      const mobile = (W < 768) || (W / H < 1);
      const sx = mobile ? 0.5 : 0.517;
      const sy = mobile ? 0.45 : 0.488;
      pivot.position.set((sx - 0.5) * visW, (0.5 - sy) * visH, 0);

      const px = Math.min(H * 0.44, W * (mobile ? 0.45 : 0.29));
      const scale = (px / H) * visH;
      pivot.scale.set(scale, scale, scale);
    }

    window.addEventListener('resize', layout);
    document.fonts?.addEventListener('loadingdone', layout);

    // 8. Interaction & Animation Variables
    let isDragging = false;
    let lastX = 0;
    let lastY = 0;
    let velX = 0;
    let velY = 0;
    let lastMoveTime = 0;
    let timeSinceRelease = 0;
    let remainingStep = 0; // for Prev/Next button animated rotation

    const axisY = new THREE.Vector3(0, 1, 0);
    const axisX = new THREE.Vector3(1, 0, 0);

    canvas.addEventListener('pointerdown', (e) => {
      isDragging = true;
      canvas.setPointerCapture(e.pointerId);
      canvas.classList.add('dragging');
      lastX = e.clientX;
      lastY = e.clientY;
      lastMoveTime = performance.now();
      velX = 0;
      velY = 0;
      remainingStep = 0;
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const now = performance.now();
      const dtMove = Math.max((now - lastMoveTime) / 1000, 0.001);
      lastMoveTime = now;

      const deltaX = e.clientX - lastX;
      const deltaY = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;

      const dx = deltaX * 0.008;
      const dy = deltaY * 0.008;

      const qY = new THREE.Quaternion().setFromAxisAngle(axisY, dx);
      spinner.quaternion.premultiply(qY);
      const qX = new THREE.Quaternion().setFromAxisAngle(axisX, dy);
      spinner.quaternion.premultiply(qX);

      // Track velocity normalized to ~16.67ms frame
      const frameFactor = 0.01667 / dtMove;
      velX = dx * frameFactor;
      velY = dy * frameFactor;
      timeSinceRelease = 0;
    });

    function endDrag(e) {
      if (!isDragging) return;
      isDragging = false;
      canvas.classList.remove('dragging');
      try {
        canvas.releasePointerCapture(e.pointerId);
      } catch (err) {}
      timeSinceRelease = 0;
    }

    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    // Prev / Next arrow buttons: smoothly rotate cube -90° / +90° around Y
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');

    if (prevBtn) {
      prevBtn.addEventListener('click', (e) => {
        e.preventDefault();
        velX = 0;
        velY = 0;
        remainingStep += -(Math.PI / 2);
      });
    }

    if (nextBtn) {
      nextBtn.addEventListener('click', (e) => {
        e.preventDefault();
        velX = 0;
        velY = 0;
        remainingStep += (Math.PI / 2);
      });
    }

    // Pagination Dots
    const dotButtons = document.querySelectorAll('.dots .dot');
    dotButtons.forEach((dot) => {
      dot.addEventListener('click', () => {
        dotButtons.forEach((d) => d.classList.remove('active'));
        dot.classList.add('active');
      });
    });

    // 9. Main Render Loop
    let lastTime = performance.now();

    function tick(now) {
      const rawDt = (now - lastTime) / 1000;
      lastTime = now;
      const dt = Math.min(rawDt, 0.05);

      if (isDragging) {
        timeSinceRelease = 0;
      } else {
        timeSinceRelease += dt;

        // Button step rotation (Prev/Next)
        if (Math.abs(remainingStep) > 0.0005) {
          const step = remainingStep * Math.min(1.0, 0.09 * dt * 60);
          remainingStep -= step;
          const qStep = new THREE.Quaternion().setFromAxisAngle(axisY, step);
          spinner.quaternion.premultiply(qStep);
        } else {
          remainingStep = 0;

          // Inertia damping
          if (Math.abs(velX) > 0.00001 || Math.abs(velY) > 0.00001) {
            const qY = new THREE.Quaternion().setFromAxisAngle(axisY, velX);
            spinner.quaternion.premultiply(qY);
            const qX = new THREE.Quaternion().setFromAxisAngle(axisX, velY);
            spinner.quaternion.premultiply(qX);

            const damping = Math.pow(0.94, dt * 60);
            velX *= damping;
            velY *= damping;
          }

          // Idle drift (ramps in after 0.6s)
          if (timeSinceRelease > 0.6) {
            const blend = Math.min(1.0, (timeSinceRelease - 0.6) / 1.0);
            const driftY = 0.0035 * blend * (dt * 60);
            const driftX = 0.0012 * blend * (dt * 60);

            const qDriftY = new THREE.Quaternion().setFromAxisAngle(axisY, driftY);
            spinner.quaternion.premultiply(qDriftY);
            const qDriftX = new THREE.Quaternion().setFromAxisAngle(axisX, driftX);
            spinner.quaternion.premultiply(qDriftX);
          }
        }
      }

      // Three-pass rendering pipeline:
      // 1) Render bgScene -> rtBack
      if (cubeMesh) cubeMesh.visible = false;
      renderer.setRenderTarget(rtBack);
      renderer.clear();
      renderer.render(bgScene, camera);

      // 2) Render bgScene -> rtFront, then cube with backMat -> rtFront
      renderer.setRenderTarget(rtFront);
      renderer.clear();
      renderer.render(bgScene, camera);

      if (cubeMesh) {
        cubeMesh.visible = true;
        cubeMesh.material = backMat;
        renderer.autoClear = false;
        renderer.render(scene, camera);
      }

      // 3) Render bgScene -> screen, then cube with frontMat -> screen
      renderer.setRenderTarget(null);
      renderer.clear();
      renderer.render(bgScene, camera);

      if (cubeMesh) {
        cubeMesh.material = frontMat;
        renderer.clearDepth();
        renderer.render(scene, camera);
        renderer.autoClear = true;
      }

      requestAnimationFrame(tick);
    }

    // Wait for Google Font before first draw
    Promise.race([
      Promise.all([document.fonts.load('800 100px Poppins'), document.fonts.ready]),
      new Promise((res) => setTimeout(res, 2500))
    ]).then(() => {
      layout();
      requestAnimationFrame(tick);
    });
  </script>
</body>
</html>
